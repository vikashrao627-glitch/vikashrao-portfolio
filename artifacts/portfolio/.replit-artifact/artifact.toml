kind = "web"
previewPath = "/"
title = "Vikash Rao Portfolio"
description = "A premium personal portfolio website for Vikash Rao, an aspiring Data Analyst. Dark-themed, glassmorphism-styled, with animated sections showcasing skills, projects, certifications, and contact info — built for recruiters."
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
